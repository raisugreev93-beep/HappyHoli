<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>होली और होलिका दहन की शुभकामनाएँ</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0; background: #000; color: #fff;
            font-family: 'Arial', sans-serif; overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        /* Animated Background */
        .bg-animate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(120deg, #ff0055, #7000ff, #00ccff, #ffcc00);
            background-size: 400% 400%; animation: gradientBG 10s infinite; z-index: -1;
        }
        @keyframes gradientBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .main-box {
            background: rgba(0, 0, 0, 0.7); padding: 30px;
            border-radius: 20px; border: 3px solid #ffcc00;
            box-shadow: 0 0 20px #ffcc00; text-align: center; width: 85%;
        }
        h1 { font-size: 2.2rem; text-shadow: 2px 2px #ff0000; margin: 10px 0; }
        .name-tag { color: #00ffcc; font-size: 1.5rem; font-weight: bold; }
        input { padding: 12px; border-radius: 10px; border: none; width: 80%; margin: 15px 0; font-size: 1rem; }
        .btn-magic { background: #ffcc00; color: #000; padding: 12px 25px; border-radius: 50px; font-weight: bold; border: none; cursor: pointer; }
        .btn-wa { background: #25D366; color: white; padding: 12px 25px; border-radius: 50px; text-decoration: none; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

    <script async="async" data-cfasync="false" src="https://pl28817016.effectivegatecpm.com/dc1a62b76cf4061cfc9a39be9458547e/invoke.js"></script>
<div id="container-dc1a62b76cf4061cfc9a39be9458547e"></div>
    <div class="bg-animate"></div>

    <div class="main-box">
        <div id="step1">
            <h1>🔥 होलिका दहन और <br> 🎨 होली की बधाई</h1>
            <input type="text" id="userInput" placeholder="यहाँ अपना नाम लिखें...">
            <br>
            <button class="btn-magic" onclick="startMagic()">जादू देखें ✨</button>
        </div>

        <div id="step2" style="display:none;">
            <p class="name-tag" id="showName"></p>
            <p>की तरफ से आपको</p>
            <h1 style="color: #ffcc00;">होलिका दहन की अग्नि में आपकी सारी परेशानियाँ जल जाएँ...</h1>
            <h1 style="color: #ff00ff;">और होली के रंग आपके जीवन को खुशियों से भर दें!</h1>
            <a id="waLink" class="btn-wa" href="#">WhatsApp पर सबको भेजें ➔</a>
        </div>
    </div>

<script>
    function startMagic() {
        var name = document.getElementById("userInput").value;
        if(name == "") { alert("कृपया नाम लिखें!"); return; }
        
        document.getElementById("step1").style.display = "none";
        document.getElementById("step2").style.display = "block";
        document.getElementById("showName").innerText = "✨ " + name + " ✨";

        // धमाका - रंगों की बारिश
        var end = Date.now() + (10 * 1000);
        var colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'];

        (function frame() {
            confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
            confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
            if (Date.now() < end) { requestAnimationFrame(frame); }
        }());

        // WhatsApp Link Setup
        var msg = window.encodeURIComponent("*"+name+"* ने आपके लिए एक खास सरप्राइज भेजा है! 🎨🔥 इसे अभी देखें 👇\n" + window.location.href);
        document.getElementById("waLink").href = "https://wa.me/?text=" + msg;
    }
</script>
</body>
</html>
